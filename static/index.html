<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PickyEaters — Hôm nay ăn gì?</title>
  <meta name="description" content="Nói món bạn thèm, nhận vài quán có thật quanh địa chỉ của bạn, giá đã tính ship.">
  <meta name="theme-color" content="#E6ECF0">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap&subset=vietnamese" rel="stylesheet">

  <!-- Leaflet (map picker for the delivery location; Esri street tiles) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="app">

    <!-- Top bar -->
    <header class="topbar">
      <a class="brand" href="/" aria-label="PickyEaters — trang chủ">
        <span class="brand-sign">PickyEaters</span>
      </a>

      <div class="topbar-actions">
        <label class="profile-select">
          <span class="visually-hidden">Hồ sơ</span>
          <select id="userSelector" aria-label="Chọn hồ sơ">
            <option value="user_01" selected>Hồ sơ mẫu</option>
            <option value="user_new">Khách mới</option>
          </select>
        </label>
        <button id="openPrefBtn" type="button" class="btn btn-outline">Khẩu vị</button>
        <button id="resetChatBtn" type="button" class="btn btn-icon" aria-label="Bắt đầu cuộc trò chuyện mới" title="Bắt đầu cuộc trò chuyện mới">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 3v6h6"/></svg>
        </button>
      </div>
    </header>

    <!-- Delivery location -->
    <section class="delivery" aria-label="Thông tin giao hàng">
      <div class="delivery-form">
        <label class="field field-name">
          <span class="field-label">Người nhận</span>
          <input type="text" id="userNameInput" placeholder="Tên" autocomplete="given-name">
        </label>
        <label class="field field-address">
          <span class="field-label">Giao đến</span>
          <input type="text" id="userAddressInput"
                 placeholder="Địa chỉ có quận/huyện, vd: 12 Nguyễn Trãi, Thanh Xuân, Hà Nội"
                 autocomplete="street-address">
        </label>
        <div class="delivery-buttons">
          <button id="openMapBtn" type="button" class="btn btn-outline map-open-btn" aria-label="Chọn vị trí giao hàng trên bản đồ">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.1-7-11.5A7 7 0 0 1 19 9.5C19 14.9 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
            <span>Bản đồ</span>
          </button>
          <button id="saveLocationBtn" type="button" class="btn btn-primary save-loc-btn">Lưu địa chỉ</button>
        </div>
      </div>

      <div class="delivery-meta">
        <div class="district-chips" role="group" aria-label="Chọn nhanh quận">
          <button type="button" class="district-chip" data-district="Cầu Giấy, Hà Nội">Cầu Giấy</button>
          <button type="button" class="district-chip" data-district="Ba Đình, Hà Nội">Ba Đình</button>
          <button type="button" class="district-chip" data-district="Đống Đa, Hà Nội">Đống Đa</button>
          <button type="button" class="district-chip" data-district="Hai Bà Trưng, Hà Nội">Hai Bà Trưng</button>
          <button type="button" class="district-chip" data-district="Hoàn Kiếm, Hà Nội">Hoàn Kiếm</button>
          <button type="button" class="district-chip" data-district="Tây Hồ, Hà Nội">Tây Hồ</button>
          <button type="button" class="district-chip" data-district="Thanh Xuân, Hà Nội">Thanh Xuân</button>
          <button type="button" class="district-chip" data-district="Quận 1, TP.HCM">Quận 1, TP.HCM</button>
        </div>
        <div id="radiusBadge" class="radius-status" role="status" aria-live="polite">
          <span id="radiusBadgeText">Tìm trong 5 km</span>
        </div>
      </div>
    </section>

    <!-- Conversation -->
    <main class="chat-workspace" aria-label="Cuộc trò chuyện">
      <div id="messagesContainer" class="messages" aria-live="polite">
        <!-- Welcome is rendered by app.js -->
      </div>
    </main>

    <!-- Composer -->
    <footer class="composer">
      <form id="chatForm" class="composer-form" novalidate>
        <label for="chatInput" class="visually-hidden">Bạn muốn ăn gì</label>
        <input type="text" id="chatInput"
               placeholder="Nói món m thèm, budget bao nhiêu… (vd: bún chả dưới 60k, không hành)"
               autocomplete="off" required>
        <button type="submit" id="sendBtn" class="send-btn" aria-label="Gửi">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>
        </button>
      </form>
    </footer>
  </div>

  <!-- Taste preferences drawer -->
  <div id="prefDrawerOverlay" class="drawer-overlay" role="dialog" aria-modal="true" aria-labelledby="prefDrawerTitle">
    <div class="drawer">
      <div class="drawer-header">
        <h2 id="prefDrawerTitle">Khẩu vị của bạn</h2>
        <button id="closePrefBtn" type="button" class="btn btn-icon" aria-label="Đóng">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>

      <div class="drawer-body">
        <div class="pref-row">
          <label class="pref-label" for="prefNameInput">Tên</label>
          <input type="text" id="prefNameInput" class="text-input" placeholder="Tên của bạn">
        </div>

        <div class="pref-row">
          <label class="pref-label" for="prefAddressInput">Địa chỉ giao hàng</label>
          <input type="text" id="prefAddressInput" class="text-input" placeholder="Có quận/huyện, vd: Duy Tân, Cầu Giấy, Hà Nội">
        </div>

        <div class="pref-row">
          <label class="pref-label pref-label-split" for="budgetInput">
            <span>Ngân sách mỗi bữa (giá món, chưa ship)</span>
            <output id="budgetValue" class="pref-value" for="budgetInput">80.000đ</output>
          </label>
          <input type="range" id="budgetInput" min="30000" max="250000" step="5000" value="80000">
          <div class="range-ends" aria-hidden="true"><span>30k</span><span>250k</span></div>
        </div>

        <div class="pref-row">
          <span class="pref-label" id="cuisineLabel">Ẩm thực hay ăn</span>
          <div id="cuisinesContainer" class="toggle-group" role="group" aria-labelledby="cuisineLabel">
            <button type="button" class="toggle-chip" data-val="Vietnamese" aria-pressed="false">Món Việt</button>
            <button type="button" class="toggle-chip" data-val="Korean" aria-pressed="false">Hàn</button>
            <button type="button" class="toggle-chip" data-val="Japanese" aria-pressed="false">Nhật</button>
            <button type="button" class="toggle-chip" data-val="Thai" aria-pressed="false">Thái</button>
            <button type="button" class="toggle-chip" data-val="Western" aria-pressed="false">Âu / fastfood</button>
            <button type="button" class="toggle-chip" data-val="Vegetarian" aria-pressed="false">Chay</button>
          </div>
        </div>

        <div class="pref-row">
          <span class="pref-label" id="flavorLabel">Ăn cay</span>
          <div id="flavorsContainer" class="toggle-group" role="group" aria-labelledby="flavorLabel">
            <button type="button" class="toggle-chip" data-val="spicy" aria-pressed="false">Thích cay</button>
            <button type="button" class="toggle-chip" data-val="non-spicy" aria-pressed="false">Không ăn cay</button>
          </div>
        </div>

        <div class="pref-row">
          <label class="pref-label" for="newIngredientInput">Không ăn / dị ứng</label>
          <p class="pref-hint">Món chứa các nguyên liệu này sẽ bị loại.</p>
          <div id="dislikedTags" class="tag-list" role="list"></div>
          <div class="add-tag">
            <input type="text" id="newIngredientInput" class="text-input" placeholder="vd: hành, đậu phộng">
            <button type="button" id="addIngredientBtn" class="btn btn-outline">Thêm</button>
          </div>
        </div>

        <div class="pref-row">
          <label class="pref-label pref-label-split" for="ratingInput">
            <span>Chỉ gợi ý quán từ</span>
            <output id="ratingValue" class="pref-value" for="ratingInput">4,3 sao</output>
          </label>
          <input type="range" id="ratingInput" min="4.0" max="4.9" step="0.1" value="4.3">
        </div>
      </div>

      <div class="drawer-footer">
        <button id="savePrefBtn" type="button" class="btn btn-primary btn-block">Lưu khẩu vị</button>
      </div>
    </div>
  </div>

  <!-- Map picker -->
  <div id="mapModal" class="map-modal" role="dialog" aria-modal="true" aria-labelledby="mapModalTitle" hidden>
    <div class="map-modal-content">
      <div class="map-modal-header">
        <h2 id="mapModalTitle">Chọn chỗ giao hàng</h2>
        <button id="closeMapBtn" type="button" class="btn btn-icon" aria-label="Đóng bản đồ">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <p class="map-modal-hint">Bấm lên bản đồ để đặt ghim, hoặc dùng vị trí hiện tại.</p>
      <div id="mapCanvas" class="map-canvas" aria-label="Bản đồ chọn vị trí"></div>
      <div id="mapPickInfo" class="map-pick-info" aria-live="polite">Chưa chọn vị trí.</div>
      <div class="map-modal-actions">
        <button id="useMyLocationBtn" type="button" class="btn btn-outline">Vị trí hiện tại</button>
        <button id="confirmMapBtn" type="button" class="btn btn-primary" disabled>Giao đến đây</button>
      </div>
    </div>
  </div>

  <div id="toastContainer" class="toasts" role="status" aria-live="polite"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/static/js/app.js"></script>
</body>
</html>
